<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="oop-svg-title oop-svg-description">
  <title id="oop-svg-title">OOP — Class / Object, Inheritance, Handle, Polymorphism</title>
  <desc id="oop-svg-description">Class의 Data·Method 정의와 new()를 통한 Object Instance 생성. Base Class Member 상속과 Derived Class 기능 확장. Handle의 Object Reference 및 동일 Instance 참조. Base Handle을 통한 Derived Object 참조와 virtual Method의 Override 구현 실행.</desc>
  <style>text { fill:#000; } path { stroke-linejoin:miter; }</style>
  <defs>
    <marker id="oop-arrow" viewBox="0 0 24 22" refX="24" refY="11" markerWidth="24" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L24 11 L0 22 Z" fill="#000"/></marker>
  </defs>
  <rect width="1536" height="1024" fill="#fff"/>
  <g id="class-object-panel">
  <rect id="class-object-panel-frame" x="37" y="115" width="720" height="434" rx="22" fill="#fff" stroke="#000" stroke-width="3.2"/>
  <text id="class-heading" x="0" y="0" transform="translate(210.576 183.315) scale(0.606112 0.651685)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Class / Object</text>
  <rect id="class-definition" x="82" y="241.5" width="214" height="118.5" rx="0" fill="#fff" stroke="#000" stroke-width="4"/>
  <rect id="created-object" x="505.5" y="241.5" width="208" height="119.5" rx="21" fill="#fff" stroke="#000" stroke-width="4"/>
  <path id="class-to-object" d="M296 303 H501" fill="none" stroke="#000" stroke-width="3.2" marker-end="url(#oop-arrow)"/>
  <text id="class" x="0" y="0" transform="translate(136.127 317.507) scale(0.468182 0.492754)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Class</text>
  <text id="new" x="0" y="0" transform="translate(361.443 283.604) scale(0.389222 0.395833)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">new</text>
  <text id="object" x="0" y="0" transform="translate(545.254 320.090) scale(0.436620 0.471910)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Object</text>
  <circle class="caption-bullet" cx="102" cy="458" r="3.4" fill="#000"/>
  <text id="class-caption-1" x="120" y="468" font-family="'Times New Roman', 'Malgun Gothic', 'Noto Sans KR', serif" font-size="32" font-weight="400">Class: Data·Method 정의</text>
  <circle class="caption-bullet" cx="102" cy="500" r="3.4" fill="#000"/>
  <text id="class-caption-2" x="120" y="510" font-family="'Times New Roman', 'Malgun Gothic', 'Noto Sans KR', serif" font-size="32" font-weight="400">Object: new()로 Instance 생성</text>
  </g>
  <g id="inheritance-panel">
  <rect id="inheritance-panel-frame" x="780" y="115" width="721" height="434" rx="22" fill="#fff" stroke="#000" stroke-width="3.2"/>
  <text id="inheritance-heading" x="0" y="0" transform="translate(975.665 182.333) scale(0.667347 0.666667)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Inheritance</text>
  <rect id="base-class-box" x="997" y="203.5" width="299" height="68" rx="0" fill="#fff" stroke="#000" stroke-width="4"/>
  <rect id="derived-class-box" x="997" y="345" width="299" height="68" rx="0" fill="#fff" stroke="#000" stroke-width="4"/>
  <path id="inheritance-stem" d="M1143.5 345 V305" fill="none" stroke="#000" stroke-width="4"/>
  <path id="inheritance-arrowhead" d="M1127.5 305 L1143.5 276.5 L1159.5 305 Z" fill="#fff" stroke="#000" stroke-width="4"/>
  <text id="base-class" x="0" y="0" transform="translate(1064.253 250.594) scale(0.373602 0.405797)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Base Class</text>
  <text id="derived-class" x="0" y="0" transform="translate(1037.629 392.594) scale(0.371380 0.405797)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Derived Class</text>
  <circle class="caption-bullet" cx="845" cy="460" r="3.4" fill="#000"/>
  <text id="inheritance-caption-1" x="863" y="470" font-family="'Times New Roman', 'Malgun Gothic', 'Noto Sans KR', serif" font-size="32" font-weight="400">Base Class의 Member 상속</text>
  <circle class="caption-bullet" cx="845" cy="502" r="3.4" fill="#000"/>
  <text id="inheritance-caption-2" x="863" y="512" font-family="'Times New Roman', 'Malgun Gothic', 'Noto Sans KR', serif" font-size="32" font-weight="400">Derived Class에서 기능 확장</text>
  </g>
  <g id="handle-panel">
  <rect id="handle-panel-frame" x="37" y="571.5" width="721" height="424" rx="22" fill="#fff" stroke="#000" stroke-width="3.2"/>
  <text id="handle-heading" x="0" y="0" transform="translate(298.769 639.328) scale(0.615635 0.671642)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Handle</text>
  <rect id="base-handle-box" x="75.5" y="670.5" width="272" height="73" rx="0" fill="#fff" stroke="#000" stroke-width="4"/>
  <rect id="derived-handle-box" x="75.5" y="779.5" width="272" height="73" rx="0" fill="#fff" stroke="#000" stroke-width="4"/>
  <rect id="shared-object-box" x="518" y="701" width="208" height="107.5" rx="20" fill="#fff" stroke="#000" stroke-width="3.6"/>
  <path id="base-handle-reference" d="M347.5 704 L513 754" fill="none" stroke="#000" stroke-width="3.2" marker-end="url(#oop-arrow)"/>
  <path id="derived-handle-reference" d="M347.5 815.5 L513 761.5" fill="none" stroke="#000" stroke-width="3.2" marker-end="url(#oop-arrow)"/>
  <text id="base-handle" x="0" y="0" transform="translate(123.308 718.597) scale(0.345776 0.402985)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Base handle</text>
  <text id="derived-handle" x="0" y="0" transform="translate(100.658 828.609) scale(0.342065 0.391304)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Derived handle</text>
  <text id="shared-object" x="0" y="0" transform="translate(565.437 767.034) scale(0.390845 0.426966)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Object</text>
  <circle class="caption-bullet" cx="102" cy="896" r="3.4" fill="#000"/>
  <text id="handle-caption" x="120" y="906" font-family="'Times New Roman', 'Malgun Gothic', 'Noto Sans KR', serif" font-size="32" font-weight="400">Object를 가리키는 Reference</text>
  <circle class="caption-bullet" cx="102" cy="938" r="3.4" fill="#000"/>
  <text id="handle-caption-2" x="120" y="948" font-family="'Times New Roman', 'Malgun Gothic', 'Noto Sans KR', serif" font-size="32" font-weight="400">여러 Handle로 동일 Instance 참조</text>
  </g>
  <g id="polymorphism-panel">
  <rect id="polymorphism-panel-frame" x="780" y="571.5" width="721" height="424" rx="22" fill="#fff" stroke="#000" stroke-width="3.2"/>
  <text id="polymorphism-heading" x="0" y="0" transform="translate(950.162 639.079) scale(0.612540 0.662921)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Polymorphism</text>
  <rect id="polymorphic-handle-box" x="810" y="712" width="240" height="77" rx="0" fill="#fff" stroke="#000" stroke-width="4"/>
  <rect id="polymorphic-object-box" x="1263" y="687" width="209" height="116" rx="20" fill="#fff" stroke="#000" stroke-width="3.6"/>
  <path id="virtual-method-call" d="M1050 749.5 H1258" fill="none" stroke="#000" stroke-width="3.2" marker-end="url(#oop-arrow)"/>
  <text id="poly-base-handle" x="0" y="0" transform="translate(842.320 761.627) scale(0.339882 0.373134)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Base handle</text>
  <text id="virtual-call" x="0" y="0" transform="translate(1077.697 734.667) scale(0.303030 0.333333)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">virtual call</text>
  <text id="poly-derived" x="0" y="0" transform="translate(1307.651 736.623) scale(0.349254 0.376812)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Derived</text>
  <text id="poly-object" x="0" y="0" transform="translate(1315.606 776.978) scale(0.348592 0.382022)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">Object</text>
  <text id="derived-behavior" x="0" y="0" transform="translate(1254.890 837.091) scale(0.277500 0.295455)" font-family="Times New Roman, Times, serif" font-size="100.000" font-weight="700">(Derived behavior)</text>
  <g id="polymorphism-description" aria-label="Base Handle로 Derived Object 참조; virtual Method의 Override 구현 실행">
  <circle class="caption-bullet" cx="845" cy="896" r="3.4" fill="#000"/>
  <text id="poly-caption-1" x="863" y="906" font-family="'Times New Roman', 'Malgun Gothic', 'Noto Sans KR', serif" font-size="32" font-weight="400">Base Handle로 Derived Object 참조</text>
  <circle class="caption-bullet" cx="845" cy="938" r="3.4" fill="#000"/>
  <text id="poly-caption-2" x="863" y="948" font-family="'Times New Roman', 'Malgun Gothic', 'Noto Sans KR', serif" font-size="32" font-weight="400">virtual Method의 Override 구현 실행</text>
  </g>
  </g>
</svg>
