 fill="white" stroke="#94a3b8" stroke-width="1.8"/><text x="848.5" y="280.5" font-size="21" font-weight="600" text-anchor="middle" fill="#1e293b" data-max-width="165">Coverage</text><text x="848.5" y="307.5" font-size="21" font-weight="600" text-anchor="middle" fill="#1e293b" data-max-width="165">sample</text><path d="M 599 274 H 719 V 179 H 757" fill="none" stroke="#475569" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 719 274 V 287 H 757" fill="none" stroke="#475569" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="719" cy="274" r="4" fill="#475569" stroke="none" stroke-width="1.6"/><text x="653" y="246" font-size="17" font-weight="500" text-anchor="middle" fill="#475569" data-max-width="116">analysis_port</text><rect x="8" y="153" width="164" height="106" rx="5" fill="white" stroke="#94a3b8" stroke-width="1.8"/><text x="90.0" y="199.5" font-size="22" font-weight="600" text-anchor="middle" fill="#1e293b" data-max-width="146">Sequence</text><text x="90.0" y="226.5" font-size="22" font-weight="600" text-anchor="middle" fill="#1e293b" data-max-width="146">uvm_object</text><path d="M 172 193 H 268" fill="none" stroke="#475569" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="90" y="290" font-size="18" font-weight="500" text-anchor="middle" fill="#475569" data-max-width="177">Stimulus object</text><text x="90" y="316" font-size="17" font-weight="400" text-anchor="middle" fill="#475569" data-max-width="177">outside hierarchy</text><path d="M 477 225 V 234 H 436 V 380" fill="none" stroke="#475569" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 588 380 V 299" fill="none" stroke="#475569" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="403" y="371" font-size="18" font-weight="400" text-anchor="middle" fill="#475569">drive</text><text x="637" y="371" font-size="18" font-weight="400" text-anchor="middle" fill="#475569">observe</text><rect x="330" y="384" width="392" height="65" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="526.0" y="410.0" font-size="22" font-weight="600" text-anchor="middle" fill="#1e293b" data-max-width="374">SystemVerilog Interface</text><text x="526.0" y="437.0" font-size="22" font-weight="600" text-anchor="middle" fill="#1e293b" data-max-width="374">signal-level connection</text><path d="M 526 449 V 480" fill="none" stroke="#475569" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="426" y="484" width="200" height="36" rx="5" fill="white" stroke="#94a3b8" stroke-width="1.8"/><text x="526.0" y="509.0" font-size="23" font-weight="600" text-anchor="middle" fill="#1e293b" data-max-width="182">DUT</text><text x="22" y="441" font-size="18" font-weight="700" text-anchor="start" fill="#475569">STATIC HDL</text><text x="22" y="468" font-size="19" font-weight="400" text-anchor="start" fill="#475569">Interface + DUT</text><text x="754" y="416" font-size="19" font-weight="500" text-anchor="start" fill="#475569" data-max-width="235">virtual interface</text><text x="754" y="443" font-size="18" font-weight="400" text-anchor="start" fill="#475569" data-max-width="235">handles connect</text><text x="754" y="470" font-size="18" font-weight="400" text-anchor="start" fill="#475569" data-max-width="235">classes to signals</text>
  </g>
</svg>
