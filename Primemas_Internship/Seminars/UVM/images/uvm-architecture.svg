<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="528" viewBox="0 0 1000 528" role="img" aria-labelledby="title desc">
  <title id="title">Generic UVM component architecture and transaction flow</title>
  <desc id="desc">UVM Test 안의 Env는 Agent, Scoreboard, Coverage를 포함한다. Agent는 Sequencer, Driver, Monitor를 포함한다. Sequence는 컴포넌트 계층 밖의 객체로서 Sequencer에 자극을 전달한다. Driver는 interface를 구동하고 Monitor는 interface를 관측해 analysis port를 통해 Scoreboard와 Coverage로 트랜잭션을 보낸다. Interface와 DUT는 정적 HDL 영역이다. 일반 학습용 예시이며 실제 CSR 실습의 구현 전체를 뜻하지 않는다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#475569"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 10 1 L 1 5 L 10 9 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="528" fill="white"/>
  <g font-family="Arial, Helvetica, 'Noto Sans KR', sans-serif">
