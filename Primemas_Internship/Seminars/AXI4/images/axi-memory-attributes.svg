<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="memory-attributes-title memory-attributes-desc" font-family="'Times New Roman', Times, 'Liberation Serif', serif" fill="#111">
  <title id="memory-attributes-title">AXI Memory Attributes — AWCACHE and ARCACHE comparison</title>
  <desc id="memory-attributes-desc">원본 AWCACHE 및 ARCACHE 분류도의 여섯 메모리 유형을 비교한다. AxCACHE[3:2]=00인 Non-cacheable 영역은 M과 B에 따라 Device 및 Normal Non-cacheable의 Non-bufferable·Bufferable로 나뉜다. AxCACHE[3:2]가 00이 아닌 Cacheable 영역은 B에 따라 Write-through와 Write-back으로 나뉜다. 각 행에서 원본 도식의 Write 응답·가시성과 Read 데이터 출처·캐시 동작을 나란히 표시한다.</desc>
  <metadata>Native vector reorganization of axi-awcache-attributes.png and axi-arcache-attributes.png. The two source diagrams are retained. Shared classifications are shown once to enlarge the text within the existing A4 page. No raster image or external resource is embedded.</metadata>
  <rect width="1000" height="400" fill="#fff"/>

  <!-- Four aligned columns replace the two half-width classification trees. -->
  <g id="table-fills">
    <rect x="4" y="4" width="992" height="42" fill="#e9ecef"/>
    <rect x="4" y="46" width="141" height="212" fill="#f0f2f4"/>
    <rect x="4" y="258" width="141" height="138" fill="#e9ecef"/>
    <rect x="145" y="96" width="851" height="56" fill="#f8f9fa"/>
    <rect x="145" y="202" width="851" height="56" fill="#f8f9fa"/>
    <rect x="145" y="316" width="851" height="80" fill="#f8f9fa"/>
  </g>
  <g id="table-rules" fill="none" stroke="#222" stroke-width="1.4">
    <rect x="4" y="4" width="992" height="392"/>
    <path d="M145 4 V396 M395 4 V396 M695 4 V396"/>
    <path d="M4 46 H996 M145 96 H996 M145 152 H996 M145 202 H996 M4 258 H996 M145 316 H996"/>
  </g>

  <g id="column-headings" font-size="24" font-weight="700" text-anchor="middle">
    <text x="74.5" y="32">AxCACHE</text>
    <text x="270" y="32">Memory type</text>
    <text x="545" y="32">AWCACHE · Write</text>
    <text x="845.5" y="32">ARCACHE · Read</text>
  </g>

  <g id="attribute-classes" text-anchor="middle">
    <text x="74.5" y="141" font-size="24" font-weight="700">[3:2] = 00</text>
    <text x="74.5" y="167" font-size="20">Non-cacheable</text>
    <text x="74.5" y="316" font-size="24" font-weight="700">[3:2] ≠ 00</text>
    <text x="74.5" y="342" font-size="20">Cacheable</text>
  </g>

  <g id="device-nonbufferable">
    <text x="161" y="67" font-size="22" font-weight="700">Device</text>
    <text x="161" y="88" font-size="18">M=0 · B=0 · Non-bufferable</text>
    <text x="411" y="79" font-size="24">Final response</text>
    <text x="711" y="79" font-size="24">Read from final destination</text>
  </g>
  <g id="device-bufferable">
    <text x="161" y="120" font-size="22" font-weight="700">Device</text>
    <text x="161" y="141" font-size="18">M=0 · B=1 · Bufferable</text>
    <text x="411" y="119" font-size="24">Intermediate response</text>
    <text x="411" y="142" font-size="24">Timely visibility</text>
    <text x="711" y="119" font-size="24">Read from final destination</text>
    <text x="711" y="142" font-size="24">B has no effect</text>
  </g>
  <g id="normal-nonbufferable">
    <text x="161" y="173" font-size="22" font-weight="700">Normal Non-cacheable</text>
    <text x="161" y="194" font-size="18">M=1 · B=0 · Non-bufferable</text>
    <text x="411" y="185" font-size="24">Final response</text>
    <text x="711" y="185" font-size="24">Read from final destination</text>
  </g>
  <g id="normal-bufferable">
    <text x="161" y="226" font-size="22" font-weight="700">Normal Non-cacheable</text>
    <text x="161" y="247" font-size="18">M=1 · B=1 · Bufferable</text>
    <text x="411" y="225" font-size="24">Intermediate response</text>
    <text x="411" y="248" font-size="24">Timely visibility</text>
    <text x="711" y="225" font-size="24">Read from final /</text>
    <text x="711" y="248" font-size="24">last write</text>
  </g>
  <g id="write-through">
    <text x="161" y="282" font-size="22" font-weight="700">Write-through</text>
    <text x="161" y="305" font-size="19">B = 0</text>
    <text x="411" y="282" font-size="24">Intermediate response</text>
    <text x="411" y="305" font-size="24">Timely final visibility</text>
    <text x="711" y="282" font-size="24">Cached write reaches</text>
    <text x="711" y="305" font-size="24">final destination</text>
  </g>
  <g id="write-back">
    <text x="161" y="348" font-size="22" font-weight="700">Write-back</text>
    <text x="161" y="373" font-size="19">B = 1</text>
    <text x="411" y="339" font-size="24">Intermediate response</text>
    <text x="411" y="362" font-size="24">No final visibility</text>
    <text x="411" y="385" font-size="24">Cache owns latest copy</text>
    <text x="711" y="351" font-size="24">Write may remain in cache</text>
    <text x="711" y="375" font-size="24">Cache owns latest copy</text>
  </g>
</svg>
