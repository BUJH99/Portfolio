<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="490" viewBox="0 0 1600 490" role="img" aria-labelledby="axi-handshake-dependencies-title axi-handshake-dependencies-desc" font-family="'Times New Roman', Times, serif" fill="#111">
  <title id="axi-handshake-dependencies-title">AXI4 Read and Write handshake dependencies</title>
  <desc id="axi-handshake-dependencies-desc">Read 왼쪽, Write 오른쪽. 단일 화살촉은 선행 신호 전후에 후행 신호를 assert할 수 있음을, 이중 화살촉은 선행 신호 assertion을 기다려야 함을 나타낸다. BVALID는 Write Address 수락과 WLAST를 포함한 마지막 Write Data 수락 이후에 가능하다.</desc>
  <metadata>Reconstructed from user-provided diagrams. Technical reference: A3.3, Figures A3-5 and A3-7. https://developer.arm.com/-/media/Arm%20Developer%20Community/PDF/IHI0022H_amba_axi_protocol_spec.pdf</metadata>
  <defs>
    <marker id="single-arrow" viewBox="0 0 19 16" refX="19" refY="8" markerWidth="19" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L19 8 L0 16 Z" fill="#111"/></marker>
    <marker id="double-arrow" viewBox="0 0 35 16" refX="35" refY="8" markerWidth="35" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L18 8 L0 16 Z M17 0 L35 8 L17 16 Z" fill="#111"/></marker>
  </defs>
  <rect width="1600" height="490" fill="#fff"/>
  <g id="read-dependencies"><text id="read-heading" x="26" y="38" font-size="34" font-weight="700" text-anchor="start">Read</text><text id="arvalid" x="132" y="150" font-size="36" font-weight="700" text-anchor="middle">ARVALID</text><text id="rvalid" x="425" y="150" font-size="36" font-weight="700" text-anchor="middle">RVALID</text><text id="arready" x="235" y="338" font-size="36" font-weight="700" text-anchor="middle">ARREADY</text><text id="rready" x="493" y="338" font-size="36" font-weight="700" text-anchor="middle">RREADY</text><path id="read-arvalid-rvalid" d="M226 139 H352" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#double-arrow)" data-from="ARVALID" data-to="RVALID" data-dependency="required"/><path id="read-arvalid-arready" d="M164 171 L209 299" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#single-arrow)" data-from="ARVALID" data-to="ARREADY" data-dependency="optional"/><path id="read-arready-rvalid" d="M282 299 L397 171" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#double-arrow)" data-from="ARREADY" data-to="RVALID" data-dependency="required"/><path id="read-rvalid-rready" d="M454 171 L487 299" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#single-arrow)" data-from="RVALID" data-to="RREADY" data-dependency="optional"/></g><path id="dependency-divider" d="M601 12 V376" fill="none" stroke="#111" stroke-width="1.5"/><g id="write-dependencies"><text id="write-heading" x="633" y="38" font-size="34" font-weight="700" text-anchor="start">Write</text><text id="awvalid" x="737" y="168" font-size="36" font-weight="700" text-anchor="middle">AWVALID</text><text id="wvalid" x="1067" y="168" font-size="36" font-weight="700" text-anchor="middle">WVALID</text><text id="bvalid" x="1380" y="168" font-size="36" font-weight="700" text-anchor="middle">BVALID</text><text id="awready" x="845" y="355" font-size="36" font-weight="700" text-anchor="middle">AWREADY</text><text id="wready" x="1210" y="355" font-size="36" font-weight="700" text-anchor="middle">WREADY</text><text id="bready" x="1493" y="355" font-size="36" font-weight="700" text-anchor="middle">BREADY</text><path id="write-awvalid-awready" d="M767 191 L814 317" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#single-arrow)" data-from="AWVALID" data-to="AWREADY" data-dependency="optional"/><path id="write-awvalid-wready" d="M831 169 L1133 317" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#single-arrow)" data-from="AWVALID" data-to="WREADY" data-dependency="optional"/><path id="write-wvalid-awready" d="M1022 191 L902 317" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#single-arrow)" data-from="WVALID" data-to="AWREADY" data-dependency="optional"/><path id="write-wvalid-wready" d="M1113 191 L1176 317" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#single-arrow)" data-from="WVALID" data-to="WREADY" data-dependency="optional"/><path id="write-bvalid-bready" d="M1426 191 L1491 317" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#single-arrow)" data-from="BVALID" data-to="BREADY" data-dependency="optional"/><path id="write-awvalid-bvalid" d="M737 126 C790 43 1185 10 1380 128" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#double-arrow)" data-from="AWVALID" data-to="BVALID" data-dependency="required"/><path id="write-awready-bvalid" d="M883 318 C916 76 1219 49 1343 127" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#double-arrow)" data-from="AWREADY" data-to="BVALID" data-dependency="required"/><path id="write-wvalid-bvalid" d="M1153 157 H1304" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#double-arrow)" data-from="WVALID" data-to="BVALID" data-dependency="required"/><path id="write-wready-bvalid" d="M1257 317 L1350 191" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#double-arrow)" data-from="WREADY" data-to="BVALID" data-dependency="required"/></g><path id="legend-rule" d="M20 389 H1580" fill="none" stroke="#111" stroke-width="1"/><path id="optional-legend-arrow" d="M30 424 H104" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#single-arrow)"/><text id="optional-legend" x="120" y="432" font-size="29" font-weight="400" text-anchor="start">Y may assert before / after X</text><path id="required-legend-arrow" d="M823 424 H900" fill="none" stroke="#111" stroke-width="2.6" marker-end="url(#double-arrow)"/><text id="required-legend" x="919" y="432" font-size="29" font-weight="400" text-anchor="start">Y must wait for X</text><text id="last-beat-rule" x="800" y="476" font-size="29" font-weight="700" text-anchor="middle">BVALID: AW handshake + final W handshake (WLAST = 1)</text>
</svg>
