<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="600" viewBox="0 0 1640 600" role="img" aria-labelledby="axi-diagram-title axi-diagram-desc" font-family="'Times New Roman', Times, serif">
  <title id="axi-diagram-title">AXI Manager–Interconnect–Subordinate channel structure</title>
  <desc id="axi-diagram-desc">Manager, Interconnect, Subordinate 사이의 다섯 AXI 채널. AW, W, AR는 Manager에서 Interconnect를 거쳐 Subordinate 방향으로 전달되고, B와 R는 반대 방향으로 전달된다. 각 채널에는 VALID/READY Handshake가 적용된다. 화살표는 채널 Payload의 전달 방향을 나타낸다.</desc>
  <defs>
    <marker id="channel-arrow" viewBox="0 0 16 14" refX="16" refY="7" markerWidth="16" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L16 7 L0 14 Z" fill="#000"/></marker>
  </defs>
  <rect width="1640" height="600" fill="#fff"/>
  <text id="handshake-heading" x="820" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#000">VALID / READY HANDSHAKE ON EVERY CHANNEL</text>
  <g id="axi-manager">
  <rect id="manager-boundary" x="40" y="108" width="260" height="452" fill="#fff" stroke="#000" stroke-width="2.6"/>
  <text id="manager-label" x="170" y="320" text-anchor="middle" font-size="30" font-weight="700" fill="#000">MANAGER</text>
  <text id="manager-role" x="170" y="360" text-anchor="middle" font-size="20" font-weight="400" fill="#444">Transaction initiator</text>
  </g>
  <g id="axi-interconnect">
  <rect id="interconnect-boundary" x="674" y="108" width="292" height="452" fill="#fff" stroke="#000" stroke-width="2.6"/>
  <text id="interconnect-label" x="820" y="340" text-anchor="middle" font-size="28" font-weight="700" fill="#000">INTERCONNECT</text>
  </g>
  <g id="axi-subordinate">
  <rect id="subordinate-boundary" x="1340" y="108" width="260" height="452" fill="#fff" stroke="#000" stroke-width="2.6"/>
  <text id="subordinate-label" x="1470" y="320" text-anchor="middle" font-size="30" font-weight="700" fill="#000">SUBORDINATE</text>
  <text id="subordinate-role" x="1470" y="360" text-anchor="middle" font-size="20" font-weight="400" fill="#444">Transaction target</text>
  </g>
  <g id="manager-interconnect">
  <g id="manager-interconnect-aw" data-channel="AW" data-direction="forward">
  <path d="M300 180 H674" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#channel-arrow)"/>
  <text id="manager-interconnect-aw-label" x="487" y="162" text-anchor="middle" font-size="24" font-weight="700" fill="#000">AW · WRITE ADDRESS</text>
  </g>
  <g id="manager-interconnect-w" data-channel="W" data-direction="forward">
  <path d="M300 260 H674" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#channel-arrow)"/>
  <text id="manager-interconnect-w-label" x="487" y="242" text-anchor="middle" font-size="24" font-weight="700" fill="#000">W · WRITE DATA</text>
  </g>
  <g id="manager-interconnect-b" data-channel="B" data-direction="reverse">
  <path d="M674 340 H300" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#channel-arrow)"/>
  <text id="manager-interconnect-b-label" x="487" y="322" text-anchor="middle" font-size="24" font-weight="700" fill="#000">B · WRITE RESPONSE</text>
  </g>
  <g id="manager-interconnect-ar" data-channel="AR" data-direction="forward">
  <path d="M300 424 H674" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#channel-arrow)"/>
  <text id="manager-interconnect-ar-label" x="487" y="406" text-anchor="middle" font-size="24" font-weight="700" fill="#000">AR · READ ADDRESS</text>
  </g>
  <g id="manager-interconnect-r" data-channel="R" data-direction="reverse">
  <path d="M674 504 H300" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#channel-arrow)"/>
  <text id="manager-interconnect-r-label" x="487" y="486" text-anchor="middle" font-size="24" font-weight="700" fill="#000">R · READ DATA / RESPONSE</text>
  </g>
  </g>
  <g id="interconnect-subordinate">
  <g id="interconnect-subordinate-aw" data-channel="AW" data-direction="forward">
  <path d="M966 180 H1340" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#channel-arrow)"/>
  <text id="interconnect-subordinate-aw-label" x="1153" y="162" text-anchor="middle" font-size="24" font-weight="700" fill="#000">AW · WRITE ADDRESS</text>
  </g>
  <g id="interconnect-subordinate-w" data-channel="W" data-direction="forward">
  <path d="M966 260 H1340" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#channel-arrow)"/>
  <text id="interconnect-subordinate-w-label" x="1153" y="242" text-anchor="middle" font-size="24" font-weight="700" fill="#000">W · WRITE DATA</text>
  </g>
  <g id="interconnect-subordinate-b" data-channel="B" data-direction="reverse">
  <path d="M1340 340 H966" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#channel-arrow)"/>
  <text id="interconnect-subordinate-b-label" x="1153" y="322" text-anchor="middle" font-size="24" font-weight="700" fill="#000">B · WRITE RESPONSE</text>
  </g>
  <g id="interconnect-subordinate-ar" data-channel="AR" data-direction="forward">
  <path d="M966 424 H1340" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#channel-arrow)"/>
  <text id="interconnect-subordinate-ar-label" x="1153" y="406" text-anchor="middle" font-size="24" font-weight="700" fill="#000">AR · READ ADDRESS</text>
  </g>
  <g id="interconnect-subordinate-r" data-channel="R" data-direction="reverse">
  <path d="M1340 504 H966" fill="none" stroke="#000" stroke-width="2.4" marker-end="url(#channel-arrow)"/>
  <text id="interconnect-subordinate-r-label" x="1153" y="486" text-anchor="middle" font-size="24" font-weight="700" fill="#000">R · READ DATA / RESPONSE</text>
  </g>
  </g>
</svg>
